basis:
  num_radial: 8
  cutoff: 5.0
  lmax: 2
  radial_width: null
  pbc: false

model:
  num_radial: 8
  lmax: 2
  hidden_dim: 128
  num_interactions: 4
  edge_basis: 24
  cutoff: 4.0
  num_species: 119
  pbc: false

data:
  root: data/qm9_atoms_le12_500
  dataset_name: qm9_atoms_le12_500
  train_split: train.txt
  val_split: val.txt
  test_split: test.txt
  num_workers: 0
  augment_rotations: true
  atomic_baseline: runs/qm9_atoms_le12_500/atomic_superposition_metrics.json

training:
  output_dir: runs/qm9_atoms_le12_500
  device: auto
  seed: 42
  epochs: 200
  batch_size: 16
  lr: 0.001
  weight_decay: 0.000001
  grad_clip: 5.0
  coefficient_weight: 0.0
  density_weight: 1.0
  density_loss: nmae
  train_probes: 1024
  lr_factor: 0.5
  lr_patience: 8
  min_lr: 0.000001
  early_stopping_patience: 25
